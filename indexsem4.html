<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays, DOM e Eventos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    li { cursor: pointer; margin: 4px 0; }
    .destaque { color: #b45309; font-weight: bold; }
    .feito { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1 id="titulo">Título original</h1>

  <p class="texto">Primeiro parágrafo do blog.</p>
  <p class="texto">Segundo parágrafo do blog.</p>
  <p class="texto">Terceiro parágrafo do blog.</p>

  <button id="botao">Clique aqui</button>

  <h2>Campo de teste (keyup)</h2>
  <input type="text" id="nome" placeholder="Digite seu nome">

  <h2>Lista</h2>
  <ul id="lista">
    <!-- Itens para o Event Delegation (Bloco 3) -->
    <li>Item estático 1</li>
    <li>Item estático 2</li>
    <li>Item estático 3</li>
  </ul>

  <h2>Nova tarefa</h2>
  <form id="formulario">
    <input type="text" id="tarefa" placeholder="Digite uma tarefa">
    <button type="submit">Adicionar</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
